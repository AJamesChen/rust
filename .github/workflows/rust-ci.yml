name: Rust CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7m-none-eabi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy for host crate
        run: cargo clippy -p codility --all-targets --all-features -- -D warnings

      - name: Run Clippy for embedded crate
        run: cargo clippy -p ch2-app --target thumbv7m-none-eabi --lib --bins --all-features -- -D warnings

      - name: Check embedded crate
        run: cargo check -p ch2-app --target thumbv7m-none-eabi

      - name: Run host tests
        run: cargo test -p codility --verbose
